name: Build Android APK

# Builds an installable Android debug APK from the Vite web app via Capacitor.
# Output: the "candy-rescue-saga-debug-apk" artifact on the workflow run page.

on:
  push:
    branches: ['arena/b6112a52-candycrush']
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (required by Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync into Android project
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: candy-rescue-saga-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to rolling "android-latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CandyRescueSaga-debug.apk
          NOTES="Auto-built debug APK. Branch: ${GITHUB_REF_NAME} | Commit: ${GITHUB_SHA}. On Android: download, allow 'Install unknown apps', then open the file."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create android-latest --prerelease --title "Candy Rescue Saga - Android APK (latest)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload android-latest CandyRescueSaga-debug.apk --clobber
